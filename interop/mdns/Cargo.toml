[package]
name = "go-iroh-interop-mdns"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
iroh = "1.0"
# n0's mDNS address lookup, split out of iroh itself at 1.0.
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1.46", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
