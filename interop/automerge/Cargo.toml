[package]
name = "go-iroh-interop-automerge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
automerge = "0.7"
iroh = "1.0"
n0-error = "1.0"
tokio = { version = "1.46", features = ["full"] }

# The Rust example these tests check against. iroh-automerge is a binary crate
# with no library target, so cargo cannot link it; it is declared here so that
# cargo fetches it and Cargo.lock records the commit, and build.rs compiles its
# src/protocol.rs into the peer unchanged.
iroh-automerge = { git = "https://github.com/n0-computer/iroh-examples" }
