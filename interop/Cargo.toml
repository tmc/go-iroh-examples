[package]
name = "go-iroh-interop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
bytes = "1.10"
futures-util = { version = "0.3", features = ["sink"] }
dumbpipe = "0.39"
iroh = "1.0"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.46", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# The Rust example these tests check against, taken from n0's repository rather
# than vendored, so the peer is the upstream implementation and not a copy of it.
framed-messages = { git = "https://github.com/n0-computer/iroh-examples" }
