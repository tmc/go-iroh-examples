[package]
name = "go-iroh-interop-ping"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate rather than part of ../Cargo.toml, so it pins its own
# upstream. iroh-ping 1.0 is the release built on iroh 1.x.
[dependencies]
anyhow = "1.0"
hex = "0.4"
iroh = "1.0"
iroh-ping = "1.0"
tokio = { version = "1.46", features = ["full"] }
