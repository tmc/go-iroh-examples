[package]
name = "go-iroh-interop-gossip"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate, not a member of ../Cargo.toml: iroh-gossip and
# iroh-smol-kv pull in dependencies the other interop peers do not need.
[workspace]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
hex = "0.4"
iroh = "1.0"
iroh-gossip = "0.101"
iroh-smol-kv = "0.4"
n0-future = "0.3"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.46", features = ["full"] }
